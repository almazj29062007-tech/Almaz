<!DOCTYPE html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FORM — A study in motion</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#090a0e;color:#efefeb;font-family:Arial,Helvetica,sans-serif}main{max-width:1260px;margin:auto;padding:32px 38px}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:32px}.brand{font-weight:800;letter-spacing:-2px;font-size:30px}.brand span{color:#c9ff73}small,.eyebrow{font:11px monospace;letter-spacing:2px;color:#92958e}.live{display:flex;gap:10px;align-items:center}.dot{width:6px;height:6px;background:#c9ff73;border-radius:50%;box-shadow:0 0 12px #c9ff73}.heading{display:flex;align-items:end;justify-content:space-between;margin:36px 0 24px}h1{font-size:clamp(32px,5vw,58px);font-weight:400;letter-spacing:-2.5px;margin:12px 0}.heading p{color:#92958e;font-size:13px;line-height:1.6;max-width:220px}.stage{position:relative;border:1px solid #292b2f;border-radius:16px;overflow:hidden;background:#0d1014}canvas{display:block;width:100%;aspect-ratio:16/9}.tag{position:absolute;top:22px;left:24px;font:10px monospace;letter-spacing:2px;color:#9da19e}.tag.right{left:auto;right:24px}.controls{padding:20px 24px;background:#111318;display:flex;align-items:center;gap:16px}button{border:1px solid #363a3e;background:transparent;color:#ddd;padding:11px 16px;border-radius:30px;cursor:pointer;font-size:12px}button:hover{border-color:#c9ff73}#play{background:#c9ff73;color:#12180a;border-color:#c9ff73;min-width:83px}input{flex:1;min-width:30px;accent-color:#c9ff73}time{font:11px monospace;color:#a4a79f;white-space:nowrap}footer{display:flex;justify-content:space-between;color:#777d79;font:10px monospace;letter-spacing:1px;margin-top:22px}#status{font-size:11px;color:#c9ff73;min-height:20px;margin-top:12px}@media(max-width:600px){main{padding:20px 16px}.heading p,.tag.right{display:none}.controls{padding:12px;gap:8px}button{padding:10px}#restart{display:none}footer{font-size:8px}.heading{margin-top:24px}}
</style>
<main><header><div class="brand">form<span>®</span></div><div class="live"><i class="dot"></i><small>MOTION EXPERIMENT / 001</small></div></header><section class="heading"><div><div class="eyebrow">ORDER. CHAOS. POSSIBILITY.</div><h1>Everything is in motion.</h1></div><p>A little energy. Infinite possibilities.<br>A generative study in transformation.</p></section><div class="stage"><canvas id="canvas" width="1600" height="900" aria-label="Animated particles transform between an orbit, a wave, and a sphere"></canvas><div class="tag">FORM / FIELD NOTES</div><div class="tag right">1600 × 900 · 24 SECONDS</div><div class="controls"><button id="play">Pause</button><button id="restart" aria-label="Restart animation">↺ Replay</button><input id="seek" aria-label="Animation timeline" type="range" min="0" max="24" step="0.01" value="0"><time id="time">00:00 / 00:24</time><button id="export">↓ Export video</button></div></div><div id="status" role="status"></div><footer><span>BUILT FROM PARTICLES. DRIVEN BY CURIOSITY.</span><span>THREE ACTS / ONE CONTINUOUS LOOP</span></footer></main>
<script>
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),seek=document.querySelector('#seek'),play=document.querySelector('#play'),clock=document.querySelector('#time'),statusEl=document.querySelector('#status');
let t=0,playing=!matchMedia('(prefers-reduced-motion: reduce)').matches,last=performance.now(),recording=false,recorder;
const TAU=Math.PI*2,N=1100,particles=Array.from({length:N},(_,i)=>({a:i*2.3999632297,z:1-2*(i+.5)/N,r:((i*73)%101)/101}));
const ease=x=>x*x*(3-2*x),lerp=(a,b,x)=>a+(b-a)*x;
function position(p,i,act,s){let a=p.a+s*.22; if(act===0){let r=215+65*Math.sin(p.a*3+s*.8);return [Math.cos(a)*r,Math.sin(a)*r*.56,Math.sin(p.a*2+s)*95]}if(act===1){let x=(i%55-27)*14,y=(Math.floor(i/55)-10)*18;return [x,y+Math.sin(x*.013+s*1.4+y*.017)*75,Math.cos(x*.01+y*.013+s)*100]}let r=Math.sqrt(1-p.z*p.z)*245;return [Math.cos(a)*r,p.z*245,Math.sin(a)*r]}
function render(s){ctx.fillStyle='#0c0f13';ctx.fillRect(0,0,1600,900);let bg=ctx.createRadialGradient(800,410,0,800,410,620);bg.addColorStop(0,'#1b2926');bg.addColorStop(1,'#0c0f13');ctx.fillStyle=bg;ctx.fillRect(0,0,1600,900);
ctx.strokeStyle='#ffffff08';ctx.lineWidth=1;for(let x=80;x<1600;x+=80){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,900);ctx.stroke()}for(let y=50;y<900;y+=80){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(1600,y);ctx.stroke()}
let segment=Math.floor(s/8)%3,phase=s%8,mix=ease(Math.max(0,(phase-5)/3));let pts=particles.map((p,i)=>{let a=position(p,i,segment,s),b=position(p,i,(segment+1)%3,s);let x=lerp(a[0],b[0],mix),y=lerp(a[1],b[1],mix),z=lerp(a[2],b[2],mix);return {x:800+x*(1+z/1000),y:400+y*(1+z/1000),z,r:p.r}}).sort((a,b)=>a.z-b.z);
ctx.save();ctx.globalCompositeOperation='lighter';for(let p of pts){let alpha=.3+(p.z+260)/800;ctx.fillStyle=`rgba(${p.r>.88?'202,176,255':'195,255,135'},${alpha})`;ctx.shadowColor=p.r>.88?'#ba9bff':'#bfff8e';ctx.shadowBlur=p.z>100?12:0;ctx.beginPath();ctx.arc(p.x,p.y,(1.1+(p.z+260)/220)*(p.r>.9?1.5:1),0,TAU);ctx.fill()}ctx.restore();
ctx.textAlign='center';ctx.fillStyle='#ebeee7';ctx.font='400 51px Arial';ctx.fillText(['Find your orbit.','Move with the flow.','Become something new.'][segment],800,762);ctx.font='13px monospace';ctx.fillStyle='#92a092';ctx.fillText(['01 / ENERGY IN BALANCE','02 / RHYTHM WITHOUT LIMITS','03 / POSSIBILITY TAKES SHAPE'][segment],800,804);ctx.textAlign='left';ctx.font='12px monospace';ctx.fillStyle='#a6b19d';ctx.fillText('●  LIVE GENERATIVE MOTION',48,852);ctx.textAlign='right';ctx.fillText('FORM — '+String(segment+1).padStart(2,'0'),1552,852);
seek.value=s;clock.textContent=`00:${String(Math.floor(s)).padStart(2,'0')} / 00:24`;}
function frame(now){if(playing)t+=(now-last)/1000;last=now;if(t>=24){if(recording){t=23.999;playing=false;recorder.stop()}else t%=24}render(t);requestAnimationFrame(frame)}
function sync(){play.textContent=playing?'Pause':'Play';play.setAttribute('aria-pressed',String(playing))}play.onclick=()=>{playing=!playing;sync()};document.querySelector('#restart').onclick=()=>{t=0;playing=true;sync()};seek.oninput=()=>{t=+seek.value;render(t)};document.addEventListener('keydown',e=>{if(e.code==='Space'&&e.target===document.body){e.preventDefault();play.click()}});
document.querySelector('#export').onclick=()=>{if(recording)return;if(!window.MediaRecorder||!canvas.captureStream){statusEl.textContent='Video export requires a browser with MediaRecorder support, such as Chrome.';return}try{const mime=['video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'].find(x=>MediaRecorder.isTypeSupported(x));if(!mime)throw Error('No supported video codec');let chunks=[],stream=canvas.captureStream(30);recorder=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:8000000});recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};recorder.onstop=()=>{const url=URL.createObjectURL(new Blob(chunks,{type:mime})),a=document.createElement('a');a.href=url;a.download='form-motion.webm';a.click();setTimeout(()=>URL.revokeObjectURL(url),60000);stream.getTracks().forEach(track=>track.stop());recording=false;document.querySelector('#export').disabled=false;seek.disabled=false;play.disabled=false;document.querySelector('#restart').disabled=false;statusEl.textContent='Video exported. Your download is ready.';sync()};t=0;playing=true;recording=true;sync();document.querySelector('#export').disabled=true;seek.disabled=true;play.disabled=true;document.querySelector('#restart').disabled=true;recorder.start();statusEl.textContent='Recording 24 seconds… Keep this tab active until the download starts.'}catch(e){statusEl.textContent='Export unavailable: '+e.message}};
window.renderAt=s=>{playing=false;t=s;render(s);sync()};sync();requestAnimationFrame(frame);
</script></html>
