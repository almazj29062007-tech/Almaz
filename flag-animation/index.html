<!doctype html>
<html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Uzbekistan × USA · 5 second loop</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#081422;color:#eef5fc;font:15px system-ui,sans-serif}main{max-width:1440px;margin:36px auto;padding:0 24px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}h1{font-size:20px;margin:0}small{color:#9cb3ca}#stage{aspect-ratio:16/9;position:relative;background:#10273f;border:1px solid #29435b;border-radius:4px;overflow:hidden}canvas{width:100%;height:100%;display:block}#empty{position:absolute;inset:0;display:grid;place-content:center;text-align:center;gap:12px;background:radial-gradient(ellipse at 65% 90%,#587c9b,#103e68 60%,#092b4b)}#empty strong{font-size:28px}#empty span{max-width:500px;color:#bdcede;line-height:1.6}footer{display:flex;gap:12px;align-items:center;margin-top:18px;flex-wrap:wrap}button,.file{border:1px solid #3a5670;background:#132b42;color:inherit;padding:11px 18px;border-radius:6px;cursor:pointer;font:inherit}button:disabled{opacity:.4;cursor:default}#export{background:#e7f1fc;color:#0a2239;border:0;font-weight:600}input[type=file]{display:none}#status{margin-left:auto;color:#a9c2d9;font-size:13px}#seek{width:160px}body.render main{padding:0;margin:0;max-width:none}body.render header,body.render footer{display:none}body.render #stage{border:0;border-radius:0;width:1920px;height:1080px}a{color:#c2e1ff}
</style><main><header><h1>Uzbekistan × USA</h1><small>16:9 · 1920 × 1080 · 5 секунд · 30 FPS</small></header><div id="stage"><canvas id="canvas" width="1920" height="1080"></canvas><div id="empty"><strong>Оригинал изображения</strong><span>Загрузите прикреплённый PNG или JPG. Текст, небо и свет останутся неподвижными; движение применяется только к ткани флагов.</span></div></div><footer><label class="file">Открыть изображение<input id="file" type="file" accept="image/png,image/jpeg,image/webp"></label><button id="play" disabled>Пауза</button><input id="seek" type="range" min="0" max="5" step="0.001" value="0" aria-label="Время анимации" disabled><button id="export" disabled>Экспорт MP4</button><span id="status" role="status">Ожидание оригинала</span></footer></main><script src="app.js"></script></html>
